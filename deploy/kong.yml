_format_version: "3.0"
_transform: true

services:
  - name: life-api
    url: http://api:8080

    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 15000

    routes:
      - name: life-api-route
        paths:
          - /api/v1
        strip_path: false

      - name: life-docs-route
        paths:
          - /docs
          - /openapi.yaml
        strip_path: false

      - name: life-health-route
        paths:
          - /health
        strip_path: false

    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local
          limit_by: ip